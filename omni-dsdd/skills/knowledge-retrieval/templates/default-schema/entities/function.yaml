type_id: function
cardinality: multi
desc: "系统功能，描述一条端到端的业务处理流程（含主流程、异常流程、关键步骤、输入输出）。"
id_pattern: "^FUNC-\\d{3}$"
file_pattern: "FUNC-*.md"
instance_format: markdown-with-frontmatter

attributes:
  - name: 标识
    key: id
    location: meta
    role: identifier
    content_type: scalar
    required: true
    searchable: keyword
    desc: "功能唯一标识，形如 FUNC-001。"

  - name: 名称
    key: name
    location: meta
    role: display_name
    content_type: scalar
    required: true
    searchable: keyword
    desc: "功能名称。"

  - name: 简述
    key: brief
    location: meta
    role: brief
    content_type: scalar
    required: true
    searchable: vector
    desc: "一句话概括功能的核心处理内容与目的。"

  - name: 描述
    key: description
    location: meta
    role: description
    content_type: scalar
    required: false
    searchable: vector
    desc: "功能的业务背景、处理逻辑、预期结果的中等粒度说明。"

  - name: 输入
    key: inputs
    location: meta
    content_type: scalar
    required: false
    searchable: keyword
    desc: "功能的输入参数或数据简述（详细说明放到 body 的'输入输出'属性）。"

  - name: 输出
    key: outputs
    location: meta
    content_type: scalar
    required: false
    searchable: keyword
    desc: "功能的输出结果或数据简述。"

  - name: 概述
    location: body
    content_type: prose
    required: true
    searchable: vector
    desc: "功能的详细描述，覆盖业务背景、处理逻辑、预期结果。"

  - name: 主流程
    location: body
    content_type: plantuml
    required: true
    searchable: false
    indexable: false
    desc: "PlantUML 活动图，描述主处理路径，带 swimlane 标注参与的逻辑实体。"

  - name: 异常流程
    location: body
    content_type: plantuml
    required: false
    searchable: false
    indexable: false
    desc: "异常路径的 PlantUML 活动图。"

  - name: 关键步骤说明
    location: body
    content_type: list
    required: true
    searchable: vector
    desc: "对主流程中关键步骤的文字说明（校验规则、数据转换、状态迁移等）。"

  - name: 输入输出
    location: body
    content_type: prose
    required: false
    searchable: vector
    desc: "输入/输出数据的类型、格式、来源/去向的详细说明。"

  - name: 异常场景
    location: body
    content_type: list
    required: false
    searchable: vector
    desc: "异常情况与对应的处理方式。"

  - name: 性能要求
    location: body
    content_type: list
    required: false
    searchable: keyword
    desc: "处理时延、吞吐量等性能指标。"

  - name: 约束条件
    location: body
    content_type: list
    required: false
    searchable: keyword
    desc: "内存、线程安全、并发等实现约束。"