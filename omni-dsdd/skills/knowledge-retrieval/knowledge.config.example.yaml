# 知识检索配置示例
# knowledge_model.enabled = true  → enhance 模式（需要 schema + instances）
# knowledge_model.enabled = false → baseline 模式（无需建模，Markdown heading 切分）

knowledge_model:
  enabled: false                                    # true=enhance, false=baseline
  schema_dir: ./知识模型管理/5GNR知识模型
  instances_dir: ./消费库/

raw_knowledge_dir: .                  # baseline 模式原始文档目录

cache_dir: .knowledge-cache

retrievers:
  metadata:
    enabled: true
  section:
    enabled: true
  vector:
    enabled: true
    model: "BAAI/bge-base-zh-v1.5"
    device: "cpu"
    batch_size: 32
    top_k_default: 8
    min_score: 0.30
    enhance:
      exclude_content_types: [code, enum, scalar]
      min_text_length: 4
    baseline:
      chunk_size: 512
      chunk_overlap: 64
      min_chunk_len: 40
  graph:
    enabled: true
    graph_path: ./graphify-out/graph.json
