# reverse_syntax_parser 使用的 LLM 配置（本仓库自持，不依赖 reverse 目录）
# 默认与 scripts/bash/reverse.sh 环境变量、reverse/tools/config.yaml llm 段一致，便于同环境复用
# 所有凭据与端点必须通过环境变量显式注入；本文件不提供任何默认 api_key / api_url / model 字符串值

llm:
  provider: openai
  # 必填：必须设置环境变量 OPENAI_API_KEY（脚本从 os.environ 读取，不提供兜底值）
  api_key: ${OPENAI_API_KEY}
  # 必填：必须设置环境变量 OPENAI_URL（脚本从 os.environ 读取，不提供兜底值）
  api_url: ${OPENAI_URL}
  # 必填：必须设置环境变量 OPENAI_MODEL（脚本从 os.environ 读取，不提供兜底值）
  model: ${OPENAI_MODEL}
  temperature: 0.2
  max_tokens: 200000
  timeout: 300
  max_concurrent: 30
  max_retries: 10
  retry_delay: 30.0
  retry_backoff: 2.0