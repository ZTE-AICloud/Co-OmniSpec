name: express
flow_mode: express
description: 快速模式，跳过 clarify，自动收敛 specify/design

state_management:
  start_from_stage: specify
  status_script: workflow-update-state.sh
  gate_script: workflow-gate.sh

stages:
  - name: specify
    type: agent
    skill: omni-dsdd:specify
    complete_marker: specify
    gate:
      skill: omni-dsdd:specify
      script: verify-specify-artifacts.sh
      eval_file: eval-specify-report.yaml
      min_score: 95
      blocking: true
    auto_converge:
      max_retries: 5
      inject_fixes: true
    pass_context:
      - PRESET_SPECIFY_ARGS
      - ENABLE_E2E

  - name: design
    type: agent
    skill: omni-dsdd:design
    complete_marker: design
    requires_env: true
    eval_file: eval-design-report.md
    min_score: 95
    blocking: true
    auto_converge:
      max_retries: 5
    pass_context:
      - ENABLE_E2E

  - name: tasks
    type: agent
    skill: omni-dsdd:tasks
    complete_marker: tasks
    silent: true

  - name: analyze
    type: agent
    skill: omni-dsdd:analyze
    complete_marker: analyze
    silent: true
    requires_env: true
    post_script: workflow-post-analyze.sh

  - name: implement
    type: agent
    skill: omni-dsdd:implement
    complete_marker: implement
    silent: true
    requires_env: true
    checklist: true

  - name: review
    type: parallel_agents
    skills:
      - omni-dsdd:security-review
      - omni-dsdd:code-review
    complete_marker: review
    silent: true
    requires_env: true
    critical_fix_and_rereview: true

  - name: local-sandbox-fix
    type: agent
    skill: omni-dsdd:local-sandbox-fix
    complete_marker: local-sandbox-fix
    silent: true
    requires_env: true
    gate:
      skill: omni-dsdd:local-sandbox-fix
      script: local-sandbox-fix-workflow-gate.sh
      check: complete
    pass_context:
      - FEATURE_DIR

rollback_stage_map:
  specify: 0
  design: 1
  tasks: 2
  analyze: 3
  implement: 4
  review: 5
  local-sandbox-fix: 6
