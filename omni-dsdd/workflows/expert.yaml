name: expert
flow_mode: expert
description: 专家模式，brainstorming 后通过桥接接口直接衔接 tasks/implement/review/local-sandbox-fix

state_management:
  start_from_stage: create-branch
  status_script: workflow-update-state.sh

stages:
  - name: create-branch
    type: agent
    skill: omni-dsdd:create-branch
    complete_marker: create-branch
    pass_context:
      - BRANCH_NAME
      - FEATURE_DIR

  - name: brainstorming
    type: skill
    skill: omni-dsdd:brainstorming
    complete_marker: brainstorming
    pass_context:
      - FEATURE_DIR

  - name: brainstorming-sdd-bridge
    type: agent
    skill: omni-dsdd:brainstorming-sdd-bridge
    complete_marker: brainstorming-sdd-bridge
    pass_context:
      - BRANCH_NAME
      - FEATURE_DIR

  - name: tasks
    type: agent
    skill: omni-dsdd:tasks
    complete_marker: tasks
    silent: true

  - name: implement
    type: agent
    skill: omni-dsdd:implement
    complete_marker: implement
    silent: true
    requires_env: true
    checklist: true

  - name: review
    type: parallel_agents
    skills:
      - omni-dsdd:security-review
      - omni-dsdd:code-review
    complete_marker: review
    silent: true
    requires_env: true
    critical_fix_and_rereview: true

  - name: local-sandbox-fix
    type: agent
    skill: omni-dsdd:local-sandbox-fix
    complete_marker: local-sandbox-fix
    silent: true
    requires_env: true
    gate:
      skill: omni-dsdd:local-sandbox-fix
      script: local-sandbox-fix-workflow-gate.sh
      check: complete
    pass_context:
      - FEATURE_DIR

rollback_stage_map:
  create-branch: 0
  brainstorming: 1
  brainstorming-sdd-bridge: 2
  tasks: 3
  implement: 4
  review: 5
  local-sandbox-fix: 6
